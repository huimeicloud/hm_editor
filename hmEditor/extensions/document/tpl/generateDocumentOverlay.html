<div class="hm-generate-document-layer">
    <div class="hm-generate-document-mask"></div>
    <div class="hm-generate-document-overlay">
        <div class="hm-generate-document-header">
            <span class="hm-generate-document-title">AI 生成病历</span>
            <button type="button" class="hm-generate-document-close">关闭</button>
        </div>
        <div class="hm-generate-document-body">
            <div class="hm-generate-document-content">
                <div class="hm-generate-document-stream-placeholder">
                    <span class="hm-generate-document-placeholder-image-wrap">
                        <span class="hm-generate-document-placeholder-image" aria-hidden="true"></span>
                        <span class="hm-generate-document-placeholder-dots" aria-hidden="true">
                            <span></span>
                            <span></span>
                            <span></span>
                        </span>
                    </span>
                    <span class="hm-generate-document-placeholder-text">病历正在生成...</span>
                </div>
                <div class="hm-generate-document-stream-content"></div>
                <div class="hm-generate-document-loading">
                    <img class="hm-generate-document-loading-image" alt="loading" />
                </div>
            </div>
        </div>
        <div class="hm-generate-document-footer">
            <label class="hm-generate-document-auto-apply">
                <span class="hm-generate-document-auto-apply-text">自动回填</span>
                <input type="checkbox" class="hm-generate-document-auto-apply-switch" />
                <span class="hm-generate-document-auto-apply-track" aria-hidden="true">
                    <span class="hm-generate-document-auto-apply-thumb"></span>
                </span>
            </label>
            <div class="hm-generate-document-actions">
                <button type="button" class="hm-generate-document-apply" disabled>回填</button>
                <button type="button" class="hm-generate-document-stop">停止生成</button>
                <button type="button" class="hm-generate-document-cancel">取消</button>
            </div>
        </div>
    </div>
</div>
